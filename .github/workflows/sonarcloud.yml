name: sonarcloud

# SonarCloud analysis of the node tools with the generic scanner; there is no .NET here. The
# selftest runs in ci.yml; this job is the static analysis only.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The gate measures coverage of NEW code, so the scan needs a report rather than a promise.
      # Node's own runner produces lcov. The file list is DISCOVERED, not written down: this job used
      # to carry its own copy of it, and a pull request that added two suites left them unmeasured
      # while `npm test` ran them, which showed up only as a coverage gate failure.
      - name: Test with coverage
        run: |
          npm ci --ignore-scripts
          mkdir -p coverage
          npm run test:coverage
      # Pinned to a SHA, and to v8: v4 and v5 carry an argument-injection advisory (GHSA, high),
      # which Dependabot raised on this repository's default branch on 2026-09-05. A tag is a moving
      # target and SonarCloud's own githubactions:S7637 says so; the comment is what makes the SHA
      # readable a year from now.
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
