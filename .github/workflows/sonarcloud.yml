name: sonarcloud

# SonarCloud analysis of the node tools with the generic scanner; there is no .NET here. The
# selftest runs in ci.yml; this job is the static analysis only.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The gate measures coverage of NEW code, so the scan needs a report rather than a promise.
      # Node's own runner produces lcov. The file list is DISCOVERED, not written down: this job used
      # to carry its own copy of it, and a pull request that added two suites left them unmeasured
      # while `npm test` ran them, which showed up only as a coverage gate failure.
      # `npm run test:coverage` runs every suite, the lock-fixture one included. Its NuGet case belongs to the
      # dedicated `tools · lock fixtures` job of ci.yml (the one that pins the SDK), so this step names that job and the
      # case defers by name instead of failing on whatever SDK this image happens to carry.
      - name: Test with coverage
        env:
          LOCK_FIXTURES_JOB: "tools · lock fixtures"
        run: |
          npm ci --ignore-scripts
          mkdir -p coverage
          npm run test:coverage
      # Pinned to a SHA, and to v8: v4 and v5 carry an argument-injection advisory (GHSA, high),
      # which Dependabot raised on this repository's default branch on 2026-09-05. A tag is a moving
      # target and SonarCloud's own githubactions:S7637 says so; the comment is what makes the SHA
      # readable a year from now.
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
