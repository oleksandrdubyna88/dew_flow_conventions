name: sonarcloud

# SonarCloud analysis of the node tools with the generic scanner; there is no .NET here. The
# selftest runs in ci.yml; this job is the static analysis only.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gate measures coverage of NEW code, so the scan needs a report rather than a promise.
      # Node's own runner produces lcov; the selftest is the only test there is.
      - name: Test with coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=lcov                --test-reporter-destination=coverage/lcov.info tools/selftest.test.mjs
      # Pinned to a SHA, and to v8: v4 and v5 carry an argument-injection advisory (GHSA, high),
      # which Dependabot raised on this repository's default branch on 2026-09-05. A tag is a moving
      # target and SonarCloud's own githubactions:S7637 says so; the comment is what makes the SHA
      # readable a year from now.
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
