name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools:
    name: tools · selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The tools that every consumer's CI runs (plan-lifecycle, pin-check, gate-snippet-check,
      # http-coverage, post-deploy-check) test themselves here. A tool that breaks here breaks every
      # consumer's build on its next pin bump, so it is checked here first. promote-release runs only
      # HERE rather than in a consumer, and is tested here for a different reason: it decides what
      # every consumer loads, so it is the one tool whose failure would not be caught downstream at all.
      #
      # `npm test` is bare `node --test`, which discovers tools/*.test.mjs on its own — a new tool's
      # tests are picked up by existing here, not by being added to a list.
      #
      # Most of them run against tools/fixtures — directories whose right answers are known.
      # pin-check cannot: what it asserts is a statement about two repositories ("is this pin the tip
      # of the ref it tracks"), and no directory of files can express a release branch that lags its
      # own default branch, so tools/pin-check.test.mjs builds real Git repositories in a temp dir.
      # Until 2026-09-14 this comment claimed a pin-check selftest that did not exist at all.

      # A shared rule names no product (common/rule-ownership.md). It needs no npm install, which is
      # why it runs before the step that does. The backfill is real — 129 references across 26 of 32
      # rules on the day this landed — and a check that goes red on the day it lands teaches people to
      # switch it off. But a bare --warn would let a NEW reference merge unnoticed for as long as the
      # backfill takes, which is the one thing this rule promises cannot happen. So it is a RATCHET,
      # and its budget is PER FILE (tools/ownership-baseline.json): one repo-wide total lets a branch
      # spend headroom another branch won, so cleaning ten references in one rule silently pays for
      # two new ones in another. The count is a floor as well as a ceiling: a file that got cleaner
      # fails until its number comes down in the same commit, because a number left above what the
      # file carries is room a reference can be added back into silently. Deleting the baseline file
      # is the armed state, at which point any finding at all fails.
      - name: Ownership
        run: node tools/ownership-check.mjs

      - name: Selftest
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
