name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools:
    name: tools · selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The tools that every consumer's CI runs (plan-lifecycle, pin-check, gate-snippet-check,
      # http-coverage, post-deploy-check) test themselves here. A tool that breaks here breaks every
      # consumer's build on its next pin bump, so it is checked here first. promote-release runs only
      # HERE rather than in a consumer, and is tested here for a different reason: it decides what
      # every consumer loads, so it is the one tool whose failure would not be caught downstream at all.
      #
      # `npm test` is bare `node --test`, which discovers tools/*.test.mjs on its own — a new tool's
      # tests are picked up by existing here, not by being added to a list.
      #
      # Most of them run against tools/fixtures — directories whose right answers are known.
      # pin-check cannot: what it asserts is a statement about two repositories ("is this pin the tip
      # of the ref it tracks"), and no directory of files can express a release branch that lags its
      # own default branch, so tools/pin-check.test.mjs builds real Git repositories in a temp dir.
      # Until 2026-09-14 this comment claimed a pin-check selftest that did not exist at all.

      # A shared rule names no product (common/rule-ownership.md). It needs no npm install, which is
      # why it runs before the step that does — and being first is the point: this is the check the
      # whole programme exists to arm.
      #
      # ARMED. There is no baseline file any more. It landed as a ratchet over 129 references across
      # 26 of 32 rules, because a check that goes red on the day it lands teaches people to switch it
      # off; the backlog was worked off in four stories and the allowance was deleted with the last
      # one. From here any undeclared product reference in any shared rule fails, and the cure is in
      # the tool's own output: anonymise the citation and keep its date, declare the name with an
      # `owns:` marker and a reason, or move it to the repository that owns it.
      - name: Ownership
        run: node tools/ownership-check.mjs

      - name: Selftest
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check


  # ---------------------------------------------------------------------------
  # The workflows themselves are code, and nothing checked them until now.
  #
  # actionlint reads every file under .github/workflows. The rule that earns its place on its own
  # is the script-injection one: a `${{ }}` expression written inline in a `run:` is pasted into
  # the shell source before bash parses it, and this family has already had to fix that by hand.
  # Separately, because ubuntu runners ship shellcheck, it lints the `run:` blocks as shell.
  #
  # NO NEW ACTION. actionlint publishes none — only a release binary — and every `uses:` line here
  # was just pinned to a commit SHA so the supply chain stays auditable. Pulling in an unpinnable
  # third-party action to get a linter would undo that. The binary is pinned by VERSION and verified
  # by CHECKSUM, which is the same promise a SHA pin makes: what runs is what was reviewed.
  #
  # Measured when this was added: zero in this repository and eighteen across the family, every one of them in a
  # release or deploy workflow, and all eighteen fixed before this job was allowed to fail on them.
  #
  # THE FIRST MEASUREMENT SAID ZERO EVERYWHERE AND WAS WRONG, which is why the step below asserts
  # shellcheck is present before linting. Without it actionlint keeps its OWN rules — the injection
  # check included — and silently drops the shell analysis of every `run:` block. No warning, exit
  # zero, a green check, and eighteen findings left standing.
  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          # The dependency this gate is quietly useless without — see the note above the job.
          command -v shellcheck > /dev/null || {
            echo "shellcheck is not on PATH: actionlint would skip every run: block and pass"
            exit 1
          }
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
