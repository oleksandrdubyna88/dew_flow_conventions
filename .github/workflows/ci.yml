name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools:
    name: tools · selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The tools that every consumer's CI runs (plan-lifecycle, pin-check, gate-snippet-check,
      # http-coverage, post-deploy-check) test themselves here. A tool that breaks here breaks every
      # consumer's build on its next pin bump, so it is checked here first. promote-release runs only
      # HERE rather than in a consumer, and is tested here for a different reason: it decides what
      # every consumer loads, so it is the one tool whose failure would not be caught downstream at all.
      #
      # `npm test` is bare `node --test`, which discovers tools/*.test.mjs on its own — a new tool's
      # tests are picked up by existing here, not by being added to a list.
      #
      # Most of them run against tools/fixtures — directories whose right answers are known.
      # pin-check cannot: what it asserts is a statement about two repositories ("is this pin the tip
      # of the ref it tracks"), and no directory of files can express a release branch that lags its
      # own default branch, so tools/pin-check.test.mjs builds real Git repositories in a temp dir.
      # Until 2026-09-14 this comment claimed a pin-check selftest that did not exist at all.

      # A shared rule names no product (common/rule-ownership.md). It needs no npm install, which is
      # why it runs before the step that does — and being first is the point: this is the check the
      # whole programme exists to arm.
      #
      # ARMED. There is no baseline file any more. It landed as a ratchet over 129 references across
      # 26 of 32 rules, because a check that goes red on the day it lands teaches people to switch it
      # off; the backlog was worked off in four stories and the allowance was deleted with the last
      # one. From here any undeclared product reference in any shared rule fails, and the cure is in
      # the tool's own output: anonymise the citation and keep its date, declare the name with an
      # `owns:` marker and a reason, or move it to the repository that owns it.
      - name: Ownership
        run: node tools/ownership-check.mjs

      - name: Selftest
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
