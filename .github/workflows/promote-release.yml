name: promote-release

# `release` is the ref six repositories load their policy from. This file is the SUPPORTED way to move
# it — not, as of 2026-09-14, the only possible way: the ref has no server-side protection, so anyone
# with push rights can move it by hand and skip every check below. That gap is recorded in the README
# as an accepted risk rather than left to be discovered; closing it needs a repository ruleset on
# refs/heads/release, which is settings rather than a file.
#
# What this file DOES guarantee is that a merge to main never moves the ref: there is no `on: push`
# here, only workflow_dispatch. That gap between "written" and "loaded" is the whole mechanism — main
# is where rules are WRITTEN, `release` is what is LOADED — and closing it automatically would put us
# back where we started, with every commit here reddening every open pull request in six repositories.
#
# The judgement lives in tools/promote-release.mjs rather than in this YAML, because a gate whose
# refusals cannot be tested is a gate nobody has seen close. Twenty-seven cases drive it, including
# every refusal: a sha that is not on main, a ci run that is absent, one still in progress, and one
# that finished red.
#
# There is no rewind input. Rollback is a FORWARD release — revert the content on main and promote
# the new commit. Moving `release` backwards would make every consumer's committed pin differ from
# the tip at once, so all six repositories would go red during the incident the rollback exists to
# end, and a non-fast-forward update would break every cached clone's `git submodule update --remote`.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The reviewed commit on main to publish (full 40-character sha)"
        required: true
      reason:
        description: "What this release contains, in one line, for the run summary"
        required: true

# One promotion at a time. Two concurrent runs could each judge a different sha as a forward move
# from the release they both read before either pushed.
concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: write   # to push refs/heads/release
  actions: read     # to read this repository's ci runs

jobs:
  promote:
    runs-on: ubuntu-latest
    # Every step here can hang on a network or registry failure, and the tool's own 30-second ceiling
    # covers only its `gh` call. Without this the dispatch holds a runner indefinitely and produces no
    # verdict at all, which reads like a gate still thinking rather than one that never answered.
    timeout-minutes: 10
    steps:
      - name: The gate that judges must be main's gate
        # The checkout below takes whatever ref the dispatch selected, so without this a branch
        # carrying an edited tools/promote-release.mjs could judge — and promote — a main commit
        # under rules nobody reviewed. The gate is only a gate if it is the one on main.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "promote-release: refusing to run from ${{ github.ref }}." >&2
          echo "  Dispatch this workflow against main: the gate that judges a promotion must be the" >&2
          echo "  reviewed one, not whatever a branch happens to carry." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          # The tool asks whether the sha is an ancestor of main and how far release is behind it;
          # both are questions a shallow clone cannot answer, and it refuses one outright.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The input reaches the tool as an ARGUMENT, never as text substituted into this script.
          # `${{ inputs.sha }}` written inline is expanded by Actions before the shell parses the
          # line, so a value like `$(curl …)` or `"; …; #` would run on the runner with the workflow
          # token — before the tool's 40-hex check ever sees it. Through the environment there is no
          # such expansion, and the quotes keep it one word.
          SHA: ${{ inputs.sha }}
        run: node tools/promote-release.mjs "$SHA"

      - name: Say what moved
        if: success()
        env:
          SHA: ${{ inputs.sha }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## release → \`$SHA\`"
            echo
            echo "$REASON"
            echo
            echo "Consumers pick this up on their next pin bump; nothing in a consumer changes until then."
          } >> "$GITHUB_STEP_SUMMARY"
