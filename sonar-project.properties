sonar.projectKey=remsoftdev_dew_flow_conventions
sonar.organization=remsoftdev
sonar.projectName=dew_flow_conventions
# The tools every consumer runs, and their selftest. The rules themselves are markdown and are not
# analysed; the fixtures are inputs to the tests, not code of this repository.
sonar.sources=tools
sonar.tests=tools
sonar.test.inclusions=tools/**/*.test.mjs
sonar.exclusions=tools/fixtures/**,**/node_modules/**
sonar.sourceEncoding=UTF-8
# Coverage of the tools, from node's own test runner (--experimental-test-coverage, lcov reporter).
# The selftest is the only test there is, and it is what the gate's new-code coverage is measured on.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# S4036: the developer CLI intentionally uses the operator's installed Git from PATH,
# with a constant executable name and argument arrays, under the same user and permissions.
# Repository/task input cannot select an executable or change PATH; this is not a privileged
# service executing on behalf of an untrusted caller. Fixed OS-specific Git locations would
# break portable Git, WSL and Homebrew installations without creating a security boundary.
sonar.issue.ignore.multicriteria=operatorGit,sharedOperatorGit,gitRepoArgument
sonar.issue.ignore.multicriteria.operatorGit.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.operatorGit.resourceKey=tools/lib/rule-cli.mjs
sonar.issue.ignore.multicriteria.sharedOperatorGit.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.sharedOperatorGit.resourceKey=tools/lib/git.mjs
# S8705 (argument injection) on tools/lib/git.mjs: `repo` is the value of `git -C`, which git always reads as a path,
# and gitOutput refuses an empty, non-string or dash-led value before git runs (startup-ceilings.test.mjs). The
# analyser does not see that guard as a sanitiser; the other arguments are arrays the tools build themselves, never
# shell text and never input from an untrusted caller.
sonar.issue.ignore.multicriteria.gitRepoArgument.ruleKey=jssecurity:S8705
sonar.issue.ignore.multicriteria.gitRepoArgument.resourceKey=tools/lib/git.mjs
